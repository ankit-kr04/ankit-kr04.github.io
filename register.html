
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Ankit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="index.html">Ankit.dev</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a class="active" href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="card form-card">
      <h1>Create Account</h1>
      <p>Complete the form to practice registration forms.</p>

      <form id="registerForm">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Your name" required>

        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               minlength="8" placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password"
               minlength="8" placeholder="Enter password again" required>

        <button class="btn" type="submit">Create Account</button>
      </form>

      <p id="message" role="status" style="margin-top:18px"></p>
      <p>Already registered? <a href="login.html">Login here</a>.</p>
    </div>
  </main>

  <footer>© 2026 Ankit | Register</footer>

  <script>
    const form = document.getElementById("registerForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent =
        "Demo only: the form is valid, but no account has been created.";
    });
  </script>
</body>
</html>
